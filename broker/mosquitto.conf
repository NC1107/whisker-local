# Nothing here should outlive a restart. A saved command replayed after a reboot could move the
# globe at a time nobody asked for.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# The robot's state document is about a kilobyte. Without a cap, an anonymous LAN client could
# publish huge retained messages under made-up client ids, and retained messages live in RAM.
# A packet over the cap gets its sender disconnected.
max_packet_size 32768

# Deprecated in 2.1, removed in 3.0, and still the only thing that scopes an ACL to one listener:
# the ACL plugin that replaces it applies across the whole broker even when declared under a
# listener. The image is pinned by digest in compose.yaml, so this cannot change underneath us.
per_listener_settings true

# For the dashboard server. compose.yaml does not publish this port, so only containers on the
# compose network can reach it.
listener 1883
listener_allow_anonymous true

# For the robot, and the only port the LAN can reach. The firmware has no way to send a password,
# and it keeps its factory certificate so that going back to the cloud stays simple, which leaves
# anonymous TLS. The ACL is what limits it.
listener 8883
listener_allow_anonymous true
max_connections 50
require_certificate false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
acl_file /mosquitto/config/acl
