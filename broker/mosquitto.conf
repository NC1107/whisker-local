# Nothing here should outlive a restart. A saved command replayed after a reboot could move the
# globe at a time nobody asked for.
persistence false

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# The robot's state document is about a kilobyte. The packet cap bounds one message, not the
# total, so the ACL decides who may leave retained messages at all, and the memory limit below
# is the backstop: past it the broker refuses new data instead of being killed by the container
# limit and dropping the robot's link. Bytes, since the broker does not take unit suffixes.
memory_limit 167772160
# A packet over the cap gets its sender disconnected.
max_packet_size 32768

# A client that stops reading must not be allowed to make the broker queue messages for it
# without end. The robot sends a handful of messages at a time.
max_queued_messages 200
max_inflight_messages 20

# Deprecated in 2.1, removed in 3.0, and still the only thing that scopes an ACL to one listener:
# the ACL plugin that replaces it applies across the whole broker even when declared under a
# listener. The image is pinned by digest in compose.yaml, so this cannot change underneath us.
per_listener_settings true

# For the dashboard server. compose.yaml does not publish this port, so only containers on the
# compose network can reach it.
listener 1883
listener_allow_anonymous true

# For the robot, and the only port the LAN can reach. The firmware has no way to send a password,
# and it keeps its factory certificate so that going back to the cloud stays simple, which leaves
# anonymous TLS. The ACL is what limits it.
listener 8883
listener_allow_anonymous true
# The robot, plus the odd tool from the same network. Anything past this is refused, so a client
# that opens connections in a loop cannot use up the broker's memory.
max_connections 10
# The robot's own messages are all small, so this listener takes a smaller packet than the
# internal one.
max_packet_size 16384
require_certificate false
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
acl_file /mosquitto/config/acl
