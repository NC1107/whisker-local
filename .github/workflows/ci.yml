name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Least privilege per job rather than whatever the repository default happens to be.
jobs:
  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - run: pip install ".[dev]"
      # Run from server/ so ruff picks up its config and the tests' per-file ignores.
      - run: ruff check . ../tools
      - run: pytest

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned exactly: "stable" moves, and an upstream release could change what ships.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
      # SPM linking left check-in on a white launch screen; stay on CocoaPods.
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - name: Check formatting (dart format)
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # The dashboard must work on a LAN with no internet, so nothing may load from a CDN.
      - run: flutter build web --release --no-web-resources-cdn
      # The built files still contain gstatic URLs as strings, so look at what a browser requests.
      - name: Check the web build makes no outside requests
        run: |
          # Installed beside the script because ES modules ignore NODE_PATH.
          npm install --prefix ../tools --no-save playwright-core@1.63.0
          node ../tools/check_web_offline.mjs build/web

  # The shell and the workflows are what orchestrate every build and deploy, and a mistake in
  # them only shows at runtime on main. Both tools are pinned by image digest because the
  # runner's preinstalled shellcheck and the image tagged `stable` are different versions that
  # disagree about what is an error.
  hygiene:
    name: Workflows and shell scripts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: actionlint
        run: |
          docker run --rm -v "$PWD":/repo -w /repo \
            rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 \
            -color
      - name: shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | sort -u)
          printf 'checking %d scripts\n' "${#scripts[@]}"
          docker run --rm -v "$PWD":/repo -w /repo \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            "${scripts[@]}"

  # A plain git diff instead of dorny/paths-filter: no third-party action to pin or trust,
  # and macOS minutes are only spent when iOS inputs really changed.
  changes:
    name: Detect changed inputs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
      android: ${{ steps.diff.outputs.android }}
      stack: ${{ steps.diff.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A new branch has an all-zero "before"; treat unknown history as changed.
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            {
              echo "ios=true"
              echo "android=true"
              echo "stack=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          flag() {
            if echo "$changed" | grep -qE "$2"; then echo "$1=true"; else echo "$1=false"; fi
          }
          {
            flag ios '^(app/(ios/|pubspec\.yaml$|pubspec\.lock$))'
            flag android '^(app/(android/|pubspec\.yaml$|pubspec\.lock$)|\.github/workflows/ci\.yml$)'
            flag stack '^(server/|broker/|compose\.yaml$|install\.sh$|uninstall\.sh$|scripts/|tools/|\.github/workflows/ci\.yml$)'
          } >> "$GITHUB_OUTPUT"

  ios-build:
    name: iOS build (no codesign)
    needs: changes
    # Pull requests only: a PR branch push would otherwise build on macOS twice.
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
          cache: true
      # Match release.yml: the runner's default Xcode lacks SDK symbols some plugins use.
      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode*.app" 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --release --no-codesign

  android-build:
    name: Android build
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: "3.47.0"
      - run: flutter pub get --enforce-lockfile
      # Without a keystore this falls back to debug signing, which is all a CI build needs.
      - run: flutter build apk --release

  # Brings the whole stack up the way a user does, then drives it with a fake robot. It is the
  # only job that exercises the broker's ACL and the server over real TLS.
  stack-smoke:
    name: Stack smoke test
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      # The smoke tool imports the server package and the fake robot's MQTT client.
      - run: pip install "./server[dev]"
      - run: ./install.sh --allow-loopback --build --ip 127.0.0.1 --serial LR4C000001 --port 18420
      - name: Run smoke test
        run: |
          ACCESS_KEY=$(sed -n 's/^ACCESS_KEY=//p' .env)
          export ACCESS_KEY
          python tools/e2e_smoke.py \
            --base-url http://127.0.0.1:18420 \
            --broker-host 127.0.0.1 \
            --ca data/certs/ca.crt \
            --serial LR4C000001
      - name: Container logs
        if: failure()
        run: |
          docker compose logs --no-color broker
          docker compose logs --no-color server
