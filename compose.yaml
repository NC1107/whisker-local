name: whisker-local

# Both ports are published on the LAN address only, so nothing listens on the Tailscale or Docker
# interfaces and the router has nothing to forward. Both services run as the installing user,
# which means everything under data/ can be deleted later without sudo. The server image is the
# published one when install.sh can pull it, and a local build of the same tag otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  broker:
    image: eclipse-mosquitto:2@sha256:75d6662dee52c947dc9dd9c29f1d8d7ffef78ddaf38001caa09755681e8bbc98
    restart: unless-stopped
    logging: *logging
    mem_limit: 256m
    user: "${HOST_UID:?run ./install.sh first}:${HOST_GID:?run ./install.sh first}"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ./data/acl:/mosquitto/config/acl:ro,z
      - ./data/certs/ca.crt:/mosquitto/certs/ca.crt:ro,z
      - ./data/certs/server.crt:/mosquitto/certs/server.crt:ro,z
      - ./data/certs/server.key:/mosquitto/certs/server.key:ro,z
    ports:
      - "${LAN_IP:?run ./install.sh first}:8883:8883"

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: ghcr.io/nc1107/whisker-local:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m
    user: "${HOST_UID:?run ./install.sh first}:${HOST_GID:?run ./install.sh first}"
    depends_on:
      - broker
    environment:
      TZ: "${TZ:?run ./install.sh first}"
      ROBOT_SERIAL: "${ROBOT_SERIAL:?run ./install.sh first}"
      ACCESS_KEY: "${ACCESS_KEY:?run ./install.sh first}"
      # Set to 1 in .env while looking at sample data. Leave it empty for the real robot.
      DEMO_MODE: "${DEMO_MODE:-}"
      # Leave empty for no push at all. See "Push notifications" in docs/DEPLOYMENT.md.
      PUSH_RELAY_URL: "${PUSH_RELAY_URL:-}"
    volumes:
      - ./data/db:/data:z
    ports:
      - "${LAN_IP:?run ./install.sh first}:${DASHBOARD_PORT:-8420}:8080"

  # Pretends to be the robot, so the app can be tried without one. It is only started with
  # `--profile demo`, and it speaks plain MQTT to the broker's internal port, which is why it
  # never needs the certificates.
  demo-robot:
    profiles: ["demo"]
    image: ghcr.io/nc1107/whisker-local:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 128m
    user: "${HOST_UID:?run ./install.sh first}:${HOST_GID:?run ./install.sh first}"
    depends_on:
      - broker
    # The image's check asks the web server on 8080, which this container does not run.
    healthcheck:
      disable: true
    command:
      - python
      - -m
      - whisker_local.simulator
      - --host
      - broker
      - --serial
      - "${ROBOT_SERIAL:?run ./install.sh first}"
      - --visit-every
      - "${DEMO_VISIT_EVERY_SECONDS:-600}"
      - --weights
      - "${DEMO_WEIGHTS:-10.1,9.0}"
