[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "whisker-local"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiomqtt==2.5.1",
    "cryptography==50.0.2",
    "fastapi==0.162.2",
    "pillow==13.0.0",
    "uvicorn==0.54.0",
    "whiskerless==0.2.0rc74",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S311"]
